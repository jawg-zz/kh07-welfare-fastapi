name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Dokploy
        env:
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_URL: "https://main.spidmax.win"
          APP_ID: "SiE7JonqrO0FV0kbQF1xv"
        run: |
          # Stop, set image, deploy, start
          curl -s -X POST "$DOKPLOY_URL/api/trpc/application.stop?batch=1" \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"0\":{\"json\":{\"applicationId\":\"$APP_ID\"}}}" > /dev/null
          sleep 5
          echo "Deploying..."
          curl -s -X POST "$DOKPLOY_URL/api/trpc/application.deploy?batch=1" \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"0\":{\"json\":{\"applicationId\":\"$APP_ID\",\"cleanCache\":true}}}" > /dev/null
          echo "Waiting 120s for image pull..."
          sleep 120
          echo "Starting..."
          curl -s -X POST "$DOKPLOY_URL/api/trpc/application.start?batch=1" \
            -H "x-api-key: $DOKPLOY_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"0\":{\"json\":{\"applicationId\":\"$APP_ID\"}}}" > /dev/null
          echo "Waiting 90s for container startup..."
          sleep 90
          echo "Deploy complete"
