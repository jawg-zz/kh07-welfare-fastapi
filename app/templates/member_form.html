{% extends "base.html" %}
{% block title %}{% if member %}Edit{% else %}Add{% endif %} Member — KH07 Welfare{% endblock %}
{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><i class="fas {% if member %}fa-edit{% else %}fa-user-plus{% endif %} me-2" style="color:var(--accent)"></i>{% if member %}Edit{% else %}Add{% endif %} Member</div>
            <div class="card-body">
                <form method="post" action="{% if member %}/members/{{ member.id }}/edit{% else %}/members/new{% endif %}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ member.name if member else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone_number" class="form-control" value="{{ member.phone_number if member else '' }}" placeholder="e.g. 0712345678">
                    </div>
                    {% if member %}
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="active" {% if member.is_active %}checked{% endif %} value="true">
                        <label class="form-check-label" for="active">Active Member</label>
                    </div>
                    {% endif %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent flex-grow-1"><i class="fas fa-save me-1"></i>{% if member %}Save Changes{% else %}Add Member{% endif %}</button>
                        <a href="/members" class="btn btn-outline-accent"><i class="fas fa-times"></i></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
