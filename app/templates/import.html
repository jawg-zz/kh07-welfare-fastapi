{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fas fa-upload me-2" style="color:var(--success)"></i>Import Excel Register</div>
            <div class="card-body">
                <p class="text-muted small">Upload the KH07 Contributions Register (.xlsx). Members and causes are matched by name; new ones are created automatically.</p>
                <div id="import-status"></div>
                <form hx-post="/import" hx-target="#import-status" hx-encoding="multipart/form-data" hx-swap="innerHTML">
                    <div class="mb-3">
                        <label class="form-label">Excel File</label>
                        <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required>
                    </div>
                    <button type="submit" class="btn btn-accent w-100"><i class="fas fa-cloud-upload-alt me-1"></i>Import</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
