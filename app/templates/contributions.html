{% extends "base.html" %}
{% block title %}Contributions — KH07 Welfare{% endblock %}
{% block content %}

<div class="page-title"><i class="fas fa-coins"></i>All Contributions</div>

<div class="card mb-3">
    <div class="card-body">
        <form class="row g-2 align-items-end" hx-get="/contribution-records/filter" hx-target="#contrib-table" hx-trigger="change, submit" hx-swap="outerHTML">
            <div class="col-md-3">
                <label class="form-label small text-muted">Cause</label>
                <select name="cause_id" class="form-select">
                    <option value="">All Causes</option>
                    {% for c in causes %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Year</label>
                <select name="year" class="form-select">
                    <option value="">All Years</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Month</label>
                <select name="month" class="form-select">
                    <option value="">All Months</option>
                    <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
                    <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
                    <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Payment</label>
                <select name="method" class="form-select">
                    <option value="">All Methods</option>
                    <option value="cash">Cash</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="bank">Bank</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">Search Member</label>
                <input type="text" name="q" class="form-control" placeholder="Name or member #...">
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">Amount (min - max)</label>
                <div class="d-flex gap-1">
                    <input type="number" name="amount_min" class="form-control" placeholder="Min" step="1" min="0">
                    <input type="number" name="amount_max" class="form-control" placeholder="Max" step="1" min="0">
                </div>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-accent btn-sm w-100" type="submit"><i class="fas fa-filter me-1"></i>Filter</button>
                <button class="btn btn-outline-accent btn-sm" type="reset" onclick="this.closest('form').querySelectorAll('select,input').forEach(e=>e.value=''); htmx.trigger('#contrib-table', 'change')"><i class="fas fa-undo"></i></button>
                <a id="export-filtered-link" href="/exports/filtered/csv" class="btn btn-outline-accent btn-sm" title="Export filtered"><i class="fas fa-download"></i></a>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive-custom">
        <table class="table table-hover mb-0">
            <thead><tr>
                <th class="ps-3">Date</th>
                <th>Member</th>
                <th>Cause</th>
                <th class="text-end">Amount (KES)</th>
                <th>Method</th>
                <th>Ref</th>
                <th class="pe-3">Notes</th>
                <th></th>
            </tr></thead>
            <tbody id="contrib-table">
                {% include "_contrib_table.html" %}
            </tbody>
        </table>
        </div>
    </div>
</div>
{% endblock %}
