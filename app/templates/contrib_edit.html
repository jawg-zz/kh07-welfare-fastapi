{% extends "base.html" %}
{% block title %}Edit Contribution — KH07 Welfare{% endblock %}
{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fas fa-edit me-2" style="color:var(--accent)"></i>Edit Contribution</div>
            <div class="card-body">
                <form method="post" action="/contributions/{{ c.id }}/edit">
                    <div class="mb-3">
                        <label class="form-label">Cause</label>
                        <select name="cause_id" class="form-select" required>
                            {% for cause in causes %}
                            <option value="{{ cause.id }}" {% if cause.id == c.cause_id %}selected{% endif %}>{{ cause.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (KES)</label>
                        <input type="number" name="amount" class="form-control" step="0.01" min="1" value="{{ "%.0f"|format(c.amount) }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="payment_method" class="form-select">
                            <option value="cash" {% if c.payment_method == 'cash' %}selected{% endif %}>Cash</option>
                            <option value="mpesa" {% if c.payment_method == 'mpesa' %}selected{% endif %}>M-Pesa</option>
                            <option value="bank" {% if c.payment_method == 'bank' %}selected{% endif %}>Bank Transfer</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Transaction Ref</label>
                        <input type="text" name="transaction_ref" class="form-control" value="{{ c.transaction_ref }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date Paid</label>
                        <input type="date" name="date_paid" class="form-control" value="{{ today }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <input type="text" name="notes" class="form-control" value="{{ c.notes }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent flex-grow-1"><i class="fas fa-save me-1"></i>Save</button>
                        <a href="/members/{{ c.member_id }}" class="btn btn-outline-accent"><i class="fas fa-times"></i></a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
